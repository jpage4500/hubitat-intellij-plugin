###############################################################################
# Github Actions workflow
#
# WHEN: runs on checkin to main branch
# WHAT: builds jar and create release
#
###############################################################################
name: "Release"
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_app:
    runs-on: ubuntu-latest
    permissions:
      # needed to create the GitHub release (the default GITHUB_TOKEN is read-only)
      contents: write
    env:
      # job-level so the publish step's `if` can see it (a step's own env isn't visible to its `if`)
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # computed once (same format as build.gradle's default) and passed to every gradle call, so the
      # zip, the release tag and the Marketplace version all match
      - name: Set Plugin Version
        run: echo "PLUGIN_VERSION=$(date -u +'%y.%-m.%-d-%-H%M')" >> $GITHUB_ENV

      # buildPlugin produces build/distributions/*.zip, which bundles runtime dependencies (Gson);
      # the bare jar in build/libs does not
      - name: Build with Gradle
        run: ./gradlew buildPlugin -PpluginVersion=$PLUGIN_VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PLUGIN_VERSION }}
          generate_release_notes: true
          files: |
            build/distributions/hubitat-intellij-plugin-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # skipped until the PUBLISH_TOKEN repo secret exists (the first Marketplace upload must be manual)
      - name: Publish to JetBrains Marketplace
        if: env.PUBLISH_TOKEN != ''
        run: ./gradlew publishPlugin -PpluginVersion=$PLUGIN_VERSION

  #endjob build_app
