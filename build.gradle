plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.3'  // latest version
}

group 'com.jpage4500'

// generated from the build timestamp; CI passes -PpluginVersion=... so every gradle invocation in a
// release (build, GitHub release tag, Marketplace publish) uses the same value
version = findProperty('pluginVersion') ?: new Date().format('yy.M.d-Hmm')

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

intellij {
    version = '2023.3'   // or match your installed IDE
    type = 'IC'          // IC = IntelliJ Community, IU = Ultimate
    plugins = []         // you can add dependencies here if needed
}

tasks {
    buildSearchableOptions {
        enabled = false
    }
    patchPluginXml {
        changeNotes = "Initial release"
        sinceBuild = '233.0'
        // no upper bound: compatible with all future IDE versions (a fake cap like '299.*' triggers a
        // Marketplace warning; null is required because the gradle plugin otherwise defaults to '<since>.*')
        untilBuild = provider { null }
    }
    publishPlugin {
        // JetBrains Marketplace token (https://plugins.jetbrains.com/author/me/tokens)
        token = System.getenv('JETBRAINS_PUBLISH_TOKEN')
    }
}
